{% extends "core/base.html" %}

{% block title %}{{ corporation.name }} — NETRUNNER BOARD{% endblock %}

{% block content %}

{% for i in news %}
<div class="card mb-4">
  <div class="card-body">
    <h5 class="card-title">{{ i.title }}</h5>
    <h6 class="card-subtitle mb-2 text-info">{{ i.source }}</h6>
    <p class="card-text">{{ i.content }}</p>
    <p class="card-text"><small class="text-info">Опубликовано: {{ i.posted_at }}</small></p>
    <p class="card-text"><small class="text-info">Просмотров: {{ i.views }}</small></p>
  </div>
</div>
{% endfor %}

{% endblock %}
